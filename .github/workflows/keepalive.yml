# Keep-alive for the deployed Streamlit Cloud app.
# Drives a real browser via scripts/keepalive.py, so a sleeping app is actually
# woken and a pass means the app rendered rather than that the edge answered.
# The curl ping this replaced could pass forever against a sleeping app: the
# host page and the sleep screen are both served with a 200.
name: Keep-alive

on:
  schedule:
    # Every 15 minutes. GitHub's floor is 5, and scheduled runs are queued
    # rather than guaranteed, so treat the interval as a target not a promise.
    - cron: '*/15 * * * *'
  workflow_dispatch:

# The app URL lives in scripts/keepalive.py (APP_URL), not here. There is
# deliberately no env var for it any more: the one consumer was the curl step,
# and a leftover variable nothing reads would be a trap for whoever next has to
# move the app.
#
# Do not point that URL at /~/+/ as an optimisation. The suffix answered 200 in
# 0 hops, but as of 2 August 2026 it returns 400 from GitHub Actions runners
# while the app itself is healthy. It is edge dependent, not dead: from a home
# connection the same suffix still answered 200 in 0 hops on that date, three
# times running, so reproducing it from a laptop proves nothing about what the
# runner sees. keepalive.py navigates to the bare URL and reaches the app
# through the iframe instead, which is also why /~/+/ still appears there as a
# frame selector.

# Was permissions: {} while this job was one curl. The Playwright step needs the
# repo on disk to run scripts/keepalive.py, so checkout needs contents:read and
# nothing more. Still no write scope anywhere.
permissions:
  contents: read

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      # --with-deps pulls the system libraries Chromium needs on the runner
      # image. Only chromium is installed; the default would fetch firefox and
      # webkit too and this job never uses them.
      - name: Install Playwright chromium
        run: |
          python -m pip install --upgrade pip
          pip install playwright
          python -m playwright install --with-deps chromium

      # The real check. Drives a browser, clicks Streamlit's wake button if the
      # app is asleep, and asserts the page strip rendered, which only happens
      # once the Python script has run and its output crossed the websocket.
      - name: Wake app
        run: python scripts/keepalive.py
