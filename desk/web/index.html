<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Game Day Desk</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Archivo:wght@700;800&family=IBM+Plex+Mono:wght@400;600&family=Sora:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{--bg:#0a1017;--surface:#101a24;--inset:#0d151e;--text:#e9eef3;--soft:#c3ccd5;--muted:#8d9aa6;--line:rgba(140,165,185,.14);--edge:#1a2632;--emerald:#34d399;--gold:#f0b429;--steel:#8fb3d9}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--text);font-family:Sora,sans-serif;-webkit-font-smoothing:antialiased}
.mono{font-family:'IBM Plex Mono',monospace}
.lbl{font-size:11px;font-weight:500;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
h1,h2{font-family:Archivo,sans-serif;margin:0;letter-spacing:.03em}
h2{font-size:17px}
.wrap{max-width:1400px;margin:0 auto;padding:20px 16px 90px}
header{display:flex;flex-wrap:wrap;gap:12px;justify-content:space-between;align-items:center;padding-bottom:14px;border-bottom:1px solid var(--line)}
.sub{font-size:13px;color:var(--muted);margin-top:4px}
.pill{font-size:10px;font-weight:600;letter-spacing:.1em;padding:3px 8px;border-radius:6px;border:1px solid currentColor;white-space:nowrap}
.grid{display:flex;flex-wrap:wrap;gap:20px;align-items:flex-start;margin-top:18px}
.col-a{flex:1 1 440px;min-width:0;display:flex;flex-direction:column;gap:10px}
.col-b{flex:999 1 620px;min-width:0;display:flex;flex-direction:column;gap:20px}
.head{display:flex;justify-content:space-between;align-items:baseline;gap:8px;flex-wrap:wrap}
.card{background:var(--surface);border:1px solid var(--edge);border-radius:12px}
.alert{padding:14px;display:flex;flex-direction:column;gap:10px}
.row{display:flex;justify-content:space-between;align-items:flex-end;gap:10px}
.name{font-family:Archivo,sans-serif;font-weight:700;font-size:19px}
.big{font-size:28px;font-weight:600;line-height:1;white-space:nowrap}
.facts{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
.fact{background:var(--inset);border-radius:8px;padding:7px 10px}
.fact b{display:block;font-family:'IBM Plex Mono',monospace;font-size:15px;font-weight:600;margin-top:2px}
.post{border:1px dashed rgba(140,165,185,.3);border-radius:8px;padding:11px;font-size:13px;line-height:1.5;white-space:pre-wrap;color:#dce3ea}
button{font-family:Sora,sans-serif;cursor:pointer}
.copy{font-size:13px;font-weight:600;border:none;border-radius:8px;padding:10px 16px;min-height:44px;background:var(--emerald);color:var(--bg)}
.copy.done{background:none;color:var(--emerald);border:1px solid var(--emerald)}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{font-size:12px;padding:6px 10px;border-radius:999px;border:1px solid rgba(140,165,185,.25);background:none;color:var(--soft)}
.chip.on{background:var(--emerald);border-color:var(--emerald);color:var(--bg);font-weight:600}
.games{display:grid;grid-template-columns:repeat(auto-fill,minmax(290px,1fr));gap:12px}
.game{padding:13px 15px;display:flex;flex-direction:column;gap:8px}
.lead{display:grid;grid-template-columns:104px minmax(0,1fr) 40px;gap:8px;align-items:center;padding:6px 0;border-top:1px solid rgba(140,165,185,.08);font-size:13px}
.lead span:nth-child(2){white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.flag{font-size:11px;color:var(--emerald)}
table{width:100%;border-collapse:collapse;font-size:13px}
th{text-align:left;padding:8px 8px 8px 0}
td{padding:8px 8px 8px 0;border-top:1px solid rgba(140,165,185,.1)}
.scroll{overflow-x:auto}
input[type=search]{font-family:Sora,sans-serif;font-size:14px;background:var(--bg);border:1px solid rgba(140,165,185,.25);border-radius:8px;padding:9px 12px;color:var(--text);width:240px;max-width:100%}
.empty{padding:22px;text-align:center;color:var(--muted);font-size:14px}
.warn{color:var(--gold)}
nav.tabs{display:none}
@media (max-width:820px){
  .grid{display:block}
  .col-a,.col-b{display:none}
  body[data-tab=alerts] .col-a{display:flex}
  body[data-tab=games] .col-b,body[data-tab=records] .col-b{display:flex}
  body[data-tab=games] #book,body[data-tab=records] #live{display:none!important}
  nav.tabs{display:grid;grid-template-columns:repeat(3,1fr);position:fixed;left:0;right:0;bottom:0;background:var(--bg);border-top:1px solid var(--line);padding:4px 8px calc(10px + env(safe-area-inset-bottom))}
  nav.tabs button{min-height:46px;background:none;border:none;color:var(--soft);font-size:14px}
  nav.tabs button.on{color:var(--emerald);font-weight:600}
}
</style>
</head>
<body data-tab="alerts">
<div class="wrap">
<header>
  <div>
    <h1 style="font-size:24px">GAME DAY DESK</h1>
    <div class="sub" id="sub">Loading</div>
  </div>
  <div style="display:flex;gap:8px;align-items:center">
    <span class="pill" id="mode" style="color:var(--muted)">-</span>
    <button class="chip" id="refresh" type="button">Refresh</button>
  </div>
</header>

<div class="grid">
  <section class="col-a">
    <div class="head"><h2>POSTABLE NOW</h2><span class="lbl">Rarest first</span></div>
    <div class="chips" id="tiers"></div>
    <div id="alerts"></div>
  </section>

  <div class="col-b">
    <section id="live" style="display:flex;flex-direction:column;gap:12px">
      <div class="head"><h2>LIVE GAMES</h2><span class="lbl">Leader in each stat</span></div>
      <div class="games" id="games"></div>
    </section>

    <section id="book" class="card" style="padding:16px;display:flex;flex-direction:column;gap:14px">
      <div class="head">
        <h2>RECORD BOOK</h2>
        <label class="lbl" for="q" style="display:flex;gap:8px;align-items:center">Player <input id="q" type="search" placeholder="Search a player" autocomplete="off"></label>
      </div>
      <div id="stats" style="display:flex;flex-direction:column;gap:6px"></div>
      <div id="bookbody"></div>
    </section>
  </div>
</div>
</div>

<nav class="tabs">
  <button type="button" data-t="alerts" class="on">Alerts</button>
  <button type="button" data-t="games">Games</button>
  <button type="button" data-t="records">Records</button>
</nav>
<textarea id="clip" aria-hidden="true" style="position:fixed;left:-9999px;top:0"></textarea>

<script>
const TIER_COLOR = {'ALL-TIME RECORD':'#f0b429','ALL-TIME TOP 10':'#f0b429','COMBO':'#f0b429','FASTEST':'#f0b429','AGE':'#f0b429','EARLY CAREER':'#34d399','CLUB RECORD':'#34d399','RECORD V OPP':'#34d399','GROUND RECORD':'#34d399','SEASON HIGH':'#8fb3d9','CAREER HIGH':'#8fb3d9','MILESTONE':'#c3ccd5'};
const TIERS = Object.keys(TIER_COLOR);
const STATS = ['Disposals','Kicks','Handballs','Marks','Goals','Tackles','Clearances','Hitouts'];
const SHORT = {'Score Involvements':'Score inv','Metres Gained':'Metres','Intercept Marks':'Int marks'};
const LEAD_STATS = ['Disposals','Goals','Tackles','Clearances','Marks','Hitouts','Score Involvements','Metres Gained','Intercept Marks'];
const esc = s => String(s ?? '').replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
let live = null, book = null, stat = 'Disposals';
// Club trivia is the floor of what gets read, so it starts hidden.
const DEFAULT_HIDDEN = ['RECORD V OPP','GROUND RECORD','SEASON HIGH','CAREER HIGH'];
let hidden = new Set(JSON.parse(safeGet('desk-hidden-v2') || JSON.stringify(DEFAULT_HIDDEN)));
let copied = new Set();

function safeGet(k){ try { return localStorage.getItem(k) } catch { return null } }
function safeSet(k,v){ try { localStorage.setItem(k,v) } catch {} }

async function copy(text, btn){
  let ok = false;
  try { await navigator.clipboard.writeText(text); ok = true } catch {}
  if (!ok) { const t = document.getElementById('clip'); t.value = text; t.select(); try { ok = document.execCommand('copy') } catch {} }
  if (ok) { btn.textContent = 'Copied'; btn.classList.add('done'); copied.add(btn.dataset.key) }
  else prompt('Copy this post', text);
}

function renderTiers(){
  document.getElementById('tiers').innerHTML = TIERS.map(t =>
    `<button type="button" class="chip ${hidden.has(t)?'':'on'}" data-tier="${esc(t)}">${esc(t.replace('ALL-TIME ','').toLowerCase().replace(/^./,c=>c.toUpperCase()))}</button>`).join('');
}

function needLine(a){
  if (a.tier === 'COMBO') return a.rare ? `${a.rare} before` : 'First';
  if (a.state === 'IN REACH') return `${a.needs} more`;
  if (a.tier === 'AGE' || a.tier === 'FASTEST') return a.state.toLowerCase().replace(/^./,c=>c.toUpperCase());
  return {BROKEN:'Broken',EQUALLED:'Equalled',ENTERED:'In',REACHED:'Reached',TODAY:'Today'}[a.state] || a.state;
}

function renderAlerts(){
  const box = document.getElementById('alerts');
  if (!live) { box.innerHTML = '<div class="card empty">Waiting for the desk</div>'; return }
  const list = live.alerts.filter(a => !hidden.has(a.tier));
  if (!list.length) { box.innerHTML = `<div class="card empty">Nothing postable yet${live.alerts.length ? ' in the types shown' : ''}</div>`; return }
  box.innerHTML = list.map(a => {
    const key = `${a.game}|${a.player}|${a.stat}|${a.tier}|${a.state}|${a.now}`;
    const c = TIER_COLOR[a.tier];
    const tier = a.tier === 'RECORD V OPP' ? `RECORD V ${a.opp.toUpperCase()}` : a.tier;
    const stat = a.tier === 'COMBO' ? a.stat.toLowerCase().replace(/ \+ /g, ' / ') : a.stat === 'Games' ? 'game' : (a.unit || a.stat.toLowerCase());
    return `<article class="card alert">
      <div class="row" style="align-items:center"><span class="pill" style="color:${c}">${esc(tier)}</span><span class="mono lbl" style="letter-spacing:0">${esc(a.teams)} · ${esc(a.when)}</span></div>
      <div class="lbl" style="letter-spacing:.04em;text-transform:none;color:${c}">${esc(a.rare_text || '')}</div>
      <div class="row">
        <div><div class="name">${esc(a.player)}${a.known ? '' : ' <span class="warn" title="Not matched to the record book">?</span>'}</div><div class="sub" style="margin:0">${esc(a.club)}</div></div>
        <div style="text-align:right"><div class="mono big">${esc(a.now)}</div><div class="sub" style="margin:0">${esc(stat)}</div></div>
      </div>
      <div class="facts">
        <div class="fact"><span class="lbl">Target</span><b style="${a.tier==='COMBO'?'font-size:12px;font-weight:500':''}">${esc(a.v)}</b></div>
        <div class="fact"><span class="lbl">${a.tier==='COMBO'?'Rarity':(a.tier==='AGE'||a.tier==='FASTEST')?'Standing':'Needs'}</span><b style="color:${a.state==='IN REACH'?'var(--emerald)':c}">${esc(needLine(a))}</b></div>
        <div class="fact"><span class="lbl">Held by</span><b style="font-family:Sora;font-size:12px;font-weight:500">${esc(a.holders || '-')}</b></div>
      </div>
      <div class="post">${esc(a.post)}</div>
      <div class="row" style="align-items:center"><span class="mono lbl" style="letter-spacing:0">${a.post.length} chars</span>
        <button type="button" class="copy ${copied.has(key)?'done':''}" data-key="${esc(key)}" data-post="${esc(a.post)}">${copied.has(key)?'Copied':'Copy post'}</button></div>
    </article>`;
  }).join('');
}

function renderGames(){
  const box = document.getElementById('games');
  if (!live || !live.games.length) { box.innerHTML = '<div class="card empty">No games this round</div>'; return }
  const flagged = new Map();
  live.alerts.forEach(a => { const k = a.player+'|'+a.stat; if (!flagged.has(k)) flagged.set(k, a) });
  box.innerHTML = live.games.map(g => {
    const on = g.label !== 'PRE' && g.label !== 'FT';
    const start = g.utc ? new Date(g.utc.endsWith('Z') ? g.utc : g.utc + 'Z').toLocaleTimeString([], {hour:'numeric', minute:'2-digit'}) : '';
    const rows = LEAD_STATS.map(s => {
      const top = (g.leaders[s] || [])[0];
      if (!top || !top.v) return '';
      const a = flagged.get(top.player+'|'+s);
      const flag = a ? ` <span class="flag" style="color:${TIER_COLOR[a.tier]}">${esc(a.state==='IN REACH' ? a.tier.toLowerCase()+' in '+a.needs : a.tier.toLowerCase())}</span>` : '';
      return `<div class="lead"><span class="lbl" style="font-size:10px">${SHORT[s] || s}</span><span>${esc(top.player)}${flag}</span><span class="mono" style="text-align:right;font-weight:600">${top.v}</span></div>`;
    }).join('');
    return `<article class="card game">
      <div class="row" style="align-items:center"><span style="font-weight:600;font-size:14px">${esc(g.home)} v ${esc(g.away)}</span>
        <span class="pill" style="color:${on?'var(--emerald)':'var(--muted)'}">${esc(g.label === 'PRE' ? start : g.label)}</span></div>
      <div class="row" style="font-size:12px;color:var(--muted)"><span>${esc(g.venue)}</span><span class="mono">${esc(g.score || '')}</span></div>
      <div>${rows || '<div class="sub">Not started</div>'}</div>
    </article>`;
  }).join('');
}

function renderStats(){
  const all = book ? Object.keys(book.stats) : STATS;
  const chip = s => `<button type="button" class="chip ${s===stat?'on':''}" data-stat="${esc(s)}">${esc(s)}</button>`;
  const basic = all.filter(s => !book || book.stats[s].basic), adv = all.filter(s => book && !book.stats[s].basic);
  document.getElementById('stats').innerHTML = `<div class="chips">${basic.map(chip).join('')}</div>` +
    (adv.length ? `<div class="lbl" style="margin-top:6px">Advanced</div><div class="chips">${adv.map(chip).join('')}</div>` : '');
}

function recRow(label, r){
  if (!r || !r.v) return '';
  const by = (r.by || []).map(b => `${b.player} (${b.club === label ? '' : b.club + ', '}${b.season} ${b.round})`).join('; ');
  return `<tr><td>${esc(label)}</td><td class="mono" style="font-weight:600">${r.v}</td><td style="color:var(--soft)">${esc(by)}</td><td class="mono">${r.top10_cut ?? ''}</td></tr>`;
}

function renderBook(){
  const box = document.getElementById('bookbody');
  if (!book) { box.innerHTML = '<div class="empty">Loading the record book</div>'; return }
  const q = document.getElementById('q').value.trim().toLowerCase();
  if (q.length >= 3) {
    const hits = Object.values(book.players).filter(p => p.name.toLowerCase().includes(q)).slice(0, 6);
    box.innerHTML = hits.length ? hits.map(p => `<div class="card" style="padding:12px;background:var(--inset)">
      <div class="row"><div class="name" style="font-size:16px">${esc(p.name)}</div><span class="sub" style="margin:0">${esc(p.club)} · ${p.games} games · debut ${p.debut}</span></div>
      <div class="scroll"><table style="min-width:420px;margin-top:6px"><thead><tr><th class="lbl">Stat</th><th class="lbl">Career best</th><th class="lbl">When</th><th class="lbl">Career total</th></tr></thead><tbody>
      ${Object.keys(book.stats).map(s => { const b = p.best[s]; return b ? `<tr><td>${s}</td><td class="mono" style="font-weight:600">${b.v}</td><td style="color:var(--soft)">${b.season} ${b.round} v ${esc(b.opp)}</td><td class="mono">${p.totals[s].toLocaleString()}</td></tr>` : '' }).join('')}
      </tbody></table></div></div>`).join('') : '<div class="empty">No active player by that name</div>';
    return;
  }
  const s = book.stats[stat];
  const since = s.from > 1897 ? `Counted from ${s.from}` : 'All time, from 1897';
  const top = s.all_time.map((r, i) => `<tr><td class="mono">${r.v}</td><td>${esc(r.player)}</td><td style="color:var(--soft)">${esc(r.club)} v ${esc(r.opp)}</td><td class="mono" style="color:var(--muted)">${r.season} ${r.round}</td></tr>`).join('');
  const clubs = Object.keys(s.club).sort().map(c => recRow(c, s.club[c])).join('');
  box.innerHTML = `<div class="lbl">${since} · finals included · book through ${book.through}</div>
    <div class="scroll"><table style="min-width:460px"><thead><tr><th class="lbl">${stat}</th><th class="lbl">Player</th><th class="lbl">Game</th><th class="lbl">When</th></tr></thead><tbody>${top}</tbody></table></div>
    <div class="scroll"><table style="min-width:560px"><thead><tr><th class="lbl">Club</th><th class="lbl">Record</th><th class="lbl">Held by</th><th class="lbl">Top 10 cutoff</th></tr></thead><tbody>${clubs}</tbody></table></div>`;
}

function renderHead(){
  if (!live) return;
  const t = new Date(live.generated);
  document.getElementById('sub').textContent = `${live.round} ${live.season} · ${live.games.filter(g => g.label !== 'PRE' && g.label !== 'FT').length} live · updated ${t.toLocaleTimeString([], {hour:'numeric', minute:'2-digit', second:'2-digit'})}`;
  const m = document.getElementById('mode');
  m.textContent = live.mode === 'replay' ? 'REPLAY' : 'LIVE';
  m.style.color = live.mode === 'replay' ? 'var(--gold)' : 'var(--emerald)';
}

async function load(){
  try {
    const r = await fetch('../data/live.json?' + Date.now());
    if (r.ok) { live = await r.json(); renderHead(); renderAlerts(); renderGames() }
  } catch {}
}

document.addEventListener('click', e => {
  const b = e.target.closest('button'); if (!b) return;
  if (b.dataset.post) copy(b.dataset.post, b);
  else if (b.dataset.tier) { hidden.has(b.dataset.tier) ? hidden.delete(b.dataset.tier) : hidden.add(b.dataset.tier); safeSet('desk-hidden-v2', JSON.stringify([...hidden])); renderTiers(); renderAlerts() }
  else if (b.dataset.stat) { stat = b.dataset.stat; renderStats(); renderBook() }
  else if (b.dataset.t) { document.body.dataset.tab = b.dataset.t; document.querySelectorAll('nav.tabs button').forEach(x => x.classList.toggle('on', x === b)); window.scrollTo(0, 0) }
  else if (b.id === 'refresh') load();
});
document.getElementById('q').addEventListener('input', renderBook);

renderTiers(); renderStats(); renderAlerts(); renderBook();
fetch('../data/record_book.json').then(r => r.json()).then(j => { book = j; renderStats(); renderBook() });
load(); setInterval(load, 15000);
</script>
</body>
</html>
